apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: default
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: "front-end"
        image: "gcr.io/haramawill/front-end:v1.0"
        ports:
        - containerPort: 80  # Change this if your app listens on a different port